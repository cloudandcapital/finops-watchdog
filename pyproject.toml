[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finops-watchdog"
version = "0.5.0"
description = "Robust CCAC and CSV cost anomaly detection for FinOps teams"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Diana Molski"},
]
keywords = ["finops", "cost-anomaly", "csv", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1.7",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "black>=26,<27",
    "flake8>=7,<8",
    "isort>=6,<7",
    "pip-audit>=2.10,<3",
    "pytest>=8,<9",
]

[project.scripts]
watchdog = "finops_watchdog.main:cli"
finops-watchdog = "finops_watchdog.main:cli"

[project.urls]
Homepage = "https://github.com/cloudandcapital/finops-watchdog"
Repository = "https://github.com/cloudandcapital/finops-watchdog.git"
"Bug Tracker" = "https://github.com/cloudandcapital/finops-watchdog/issues"

[tool.black]
target-version = ["py310"]

[tool.isort]
profile = "black"
