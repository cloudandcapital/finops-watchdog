name: PR Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run black --check finops_watchdog tests
      - name: Check import order
        run: uv run isort --check-only finops_watchdog tests
      - name: Check actionable lint errors
        run: uv run flake8 finops_watchdog tests --count --select=E9,F63,F7,F82,F401 --show-source --statistics
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/runtime-requirements.txt
          uv run pip-audit --cache-dir /tmp/pip-audit-cache --requirement /tmp/runtime-requirements.txt

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Install verified CCAC 0.2.0 release validator
        run: |
          curl --fail --location --silent --show-error --output /tmp/cloudandcapital_ccac-0.2.0-py3-none-any.whl https://github.com/cloudandcapital/cloud-capital-analysis-contract/releases/download/v0.2.0/cloudandcapital_ccac-0.2.0-py3-none-any.whl
          echo "bc46f363b1a03c94cf0da75759bccd0271de2c53b1f77a1a7255f9c8e7f768f1  /tmp/cloudandcapital_ccac-0.2.0-py3-none-any.whl" | sha256sum --check
          uv pip install --python .venv/bin/python /tmp/cloudandcapital_ccac-0.2.0-py3-none-any.whl
      - run: uv run pytest tests/ -q
        env:
          REQUIRE_CCAC_RELEASE_VALIDATION: "1"

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv build --out-dir dist
      - name: Install and verify wheel
        run: |
          python -m venv package-smoke
          uv pip install --python package-smoke/bin/python dist/*.whl
          package-smoke/bin/finops-watchdog --version
      - name: Verify deterministic credential-free demo
        run: |
          package-smoke/bin/finops-watchdog ccac --demo > demo-1.json
          package-smoke/bin/finops-watchdog ccac --demo > demo-2.json
          cmp demo-1.json demo-2.json
          package-smoke/bin/finops-watchdog ccac --demo --contract-version 1.0.0 > demo-explicit-1.0.json
          cmp demo-1.json demo-explicit-1.0.json
          package-smoke/bin/finops-watchdog ccac --demo --contract-version 1.1.0 > demo-1.1-a.json
          package-smoke/bin/finops-watchdog ccac --demo --contract-version 1.1.0 > demo-1.1-b.json
          cmp demo-1.1-a.json demo-1.1-b.json
      - name: Verify documented installed legacy CSV command
        run: |
          package-smoke/bin/watchdog detect \
            --input examples/cost-timeseries-sample.csv \
            --time-column date \
            --value-column amount \
            --group-by SERVICE \
            --window 30d \
            --threshold 3.0 \
            --min-amount 10 \
            --output-format json > legacy-result.json
          package-smoke/bin/python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("legacy-result.json").read_text())
          assert result.get("schema_version") == "1.0"
          assert isinstance(result.get("summary"), dict)
          assert isinstance(result.get("anomalies"), list)
          PY
